name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Typecheck, Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_ecommerce?sslmode=disable
      DIRECT_URL: postgresql://test_user:test_password@localhost:5432/test_ecommerce?sslmode=disable
      REDIS_URL: redis://localhost:6379
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      JWT_ACCESS_SECRET: ci-test-jwt-access-secret-minimum-32-characters-long
      JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-minimum-32-characters-long
      RAZORPAY_KEY_ID: rzp_test_mock_key
      RAZORPAY_KEY_SECRET: rzp_test_mock_secret
      RAZORPAY_WEBHOOK_SECRET: rzp_test_webhook_secret_key
      RUN_INTEGRATION_TESTS: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Typecheck backend
        run: npm run typecheck --workspace backend

      - name: Typecheck frontend
        run: npm run typecheck --workspace frontend

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Push schema to test database
        run: npx prisma db push --schema=backend/prisma/schema.prisma

      - name: Run backend unit and integration tests
        run: npm run test:integration

      - name: Run frontend tests
        run: npm run test --workspace frontend

      - name: Build applications
        run: npm run build
